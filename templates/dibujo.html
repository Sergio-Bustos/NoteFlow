<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloc de Dibujo | NoteFlow</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&family=Caveat:wght@400;600;700&display=swap');

        /* ══════════════════════════════════════════
           VARIABLES
        ══════════════════════════════════════════ */
        :root {
            --morado-oscuro:  #3b1f6b;
            --morado-medio:   #5c3ca6;
            --morado-vivo:    #7c4dff;
            --morado-claro:   #b39ddb;
            --violeta-suave:  #ede7f6;
            --blanco:         #ffffff;
            --gris-claro:     #f5f0ff;
            --sombra:         rgba(60, 20, 120, 0.18);
            --radio:          18px;
            --radio-btn:      30px;
        }

        /* ══════════════════════════════════════════
           RESET Y BASE
        ══════════════════════════════════════════ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #2d1b5e 0%, #4a2d8a 45%, #7c4dff 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 28px 20px 40px;
            overflow-x: hidden;
        }

        /* ══════════════════════════════════════════
           ENCABEZADO
        ══════════════════════════════════════════ */
        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            margin-bottom: 22px;
        }

        .app-titulo {
            font-family: 'Caveat', cursive;
            font-size: 2rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .app-titulo i { font-size: 1.5rem; color: var(--morado-claro); }

        .btn-volver {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1.5px solid rgba(255,255,255,0.3);
            border-radius: var(--radio-btn);
            padding: 8px 18px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
            cursor: pointer;
        }
        .btn-volver:hover { background: rgba(255,255,255,0.25); color: #fff; }

        /* ══════════════════════════════════════════
           PANEL PRINCIPAL
        ══════════════════════════════════════════ */
        .panel {
            background: var(--blanco);
            border-radius: 24px;
            box-shadow: 0 24px 60px var(--sombra);
            width: 100%;
            max-width: 900px;
            overflow: hidden;
        }

        /* ══════════════════════════════════════════
           BARRA DE HERRAMIENTAS
        ══════════════════════════════════════════ */
        .toolbar {
            background: var(--gris-claro);
            border-bottom: 1.5px solid #ede7f6;
            padding: 14px 20px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
        }

        /* Grupos dentro de la toolbar */
        .tool-group {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-right: 14px;
            border-right: 1.5px solid #d1c4e9;
        }
        .tool-group:last-child { border-right: none; padding-right: 0; }

        .tool-label {
            font-size: 0.72rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--morado-medio);
            letter-spacing: 0.6px;
            white-space: nowrap;
        }

        /* ── Botones de herramienta ── */
        .btn-tool {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            border: 1.5px solid transparent;
            background: var(--blanco);
            color: var(--morado-medio);
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.18s;
            box-shadow: 0 2px 6px rgba(90,50,180,0.08);
        }
        .btn-tool:hover { background: #ede7f6; color: var(--morado-vivo); }
        .btn-tool.activo {
            background: var(--morado-vivo);
            color: #fff;
            border-color: var(--morado-oscuro);
            box-shadow: 0 3px 10px rgba(124,77,255,0.35);
        }

        /* ── Selector de color ── */
        .color-picker-wrap {
            position: relative;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid var(--morado-claro);
            box-shadow: 0 2px 8px var(--sombra);
            cursor: pointer;
            transition: transform 0.15s;
        }
        .color-picker-wrap:hover { transform: scale(1.1); }
        .color-picker-wrap input[type="color"] {
            position: absolute;
            inset: -8px;
            width: calc(100% + 16px);
            height: calc(100% + 16px);
            border: none;
            cursor: pointer;
            opacity: 1;
        }

        /* ── Slider de grosor ── */
        .grosor-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .grosor-wrap input[type="range"] {
            width: 90px;
            accent-color: var(--morado-vivo);
            cursor: pointer;
        }
        .grosor-preview {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .grosor-punto {
            background: var(--morado-vivo);
            border-radius: 50%;
            width: 6px;
            height: 6px;
            transition: width 0.15s, height 0.15s;
        }

        /* ── Paleta de colores rápidos ── */
        .paleta-colores {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }
        .color-rapido {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.15s, border-color 0.15s;
        }
        .color-rapido:hover { transform: scale(1.2); }
        .color-rapido.seleccionado { border-color: var(--morado-oscuro); transform: scale(1.15); }

        /* ── Botones de acción ── */
        .btn-accion {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: var(--radio-btn);
            border: none;
            font-size: 0.82rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.18s;
            white-space: nowrap;
            font-family: 'Nunito', sans-serif;
        }
        .btn-deshacer { background: #ede7f6; color: var(--morado-oscuro); }
        .btn-deshacer:hover { background: #d1c4e9; }
        .btn-limpiar  { background: #fce4ec; color: #c62828; }
        .btn-limpiar:hover  { background: #f8bbd0; }
        .btn-guardar  {
            background: linear-gradient(135deg, var(--morado-vivo), var(--morado-oscuro));
            color: #fff;
            box-shadow: 0 4px 14px rgba(124,77,255,0.4);
        }
        .btn-guardar:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(124,77,255,0.5); }

        /* ══════════════════════════════════════════
           ÁREA DEL CANVAS
        ══════════════════════════════════════════ */
        .canvas-wrap {
            position: relative;
            background: #fff;
        }

        #pizarra {
            display: block;
            width: 100%;
            height: 520px;
            cursor: crosshair;
            touch-action: none;
        }

        /* Overlay cuando está vacío */
        .canvas-hint {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: opacity 0.4s;
        }
        .canvas-hint i { font-size: 3rem; color: #e0d7f5; margin-bottom: 10px; }
        .canvas-hint p { font-family: 'Caveat', cursive; font-size: 1.2rem; color: #c5b8e8; }

        /* ══════════════════════════════════════════
           BARRA INFERIOR (título + estado)
        ══════════════════════════════════════════ */
        .barra-inferior {
            background: var(--gris-claro);
            border-top: 1.5px solid #ede7f6;
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .input-titulo {
            flex: 1;
            min-width: 180px;
            padding: 9px 16px;
            border: 1.5px solid #d1c4e9;
            border-radius: 30px;
            font-size: 0.9rem;
            font-family: 'Nunito', sans-serif;
            color: var(--morado-oscuro);
            background: #fff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-titulo:focus {
            border-color: var(--morado-vivo);
            box-shadow: 0 0 0 3px rgba(124,77,255,0.12);
        }
        .input-titulo::placeholder { color: #b39ddb; }

        .estado-guardado {
            font-size: 0.8rem;
            color: #7b1fa2;
            display: flex;
            align-items: center;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.4s;
        }
        .estado-guardado.visible { opacity: 1; }

        /* ══════════════════════════════════════════
           TOAST
        ══════════════════════════════════════════ */
        .toast-dibujo {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--morado-oscuro);
            color: #fff;
            padding: 12px 26px;
            border-radius: 30px;
            font-size: 0.88rem;
            font-weight: 600;
            box-shadow: 0 8px 24px rgba(60,20,120,0.35);
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 999;
        }
        .toast-dibujo.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ══════════════════════════════════════════
           RESPONSIVE
        ══════════════════════════════════════════ */
        @media (max-width: 600px) {
            .app-titulo { font-size: 1.4rem; }
            #pizarra { height: 360px; }
            .toolbar { gap: 8px; }
            .tool-group { padding-right: 8px; }
        }
    </style>
</head>
<body>

    <!-- Encabezado -->
    <div class="app-header">
        <div class="app-titulo">
            <i class="fas fa-paint-brush"></i>
            Bloc de Dibujo
        </div>
        <a href="/notas" class="btn-volver">
            <i class="fas fa-arrow-left"></i> Mis notas
        </a>
    </div>

    <!-- Panel principal -->
    <div class="panel">

        <!-- ── Toolbar ── -->
        <div class="toolbar">

            <!-- Herramientas -->
            <div class="tool-group">
                <span class="tool-label">Herramienta</span>
                <button class="btn-tool activo" id="btnLapiz" title="Lápiz" onclick="seleccionarHerramienta('lapiz', this)">
                    <i class="fas fa-pen"></i>
                </button>
                <button class="btn-tool" id="btnBorrador" title="Borrador" onclick="seleccionarHerramienta('borrador', this)">
                    <i class="fas fa-eraser"></i>
                </button>
                <button class="btn-tool" id="btnLinea" title="Línea recta" onclick="seleccionarHerramienta('linea', this)">
                    <i class="fas fa-slash"></i>
                </button>
                <button class="btn-tool" id="btnRectangulo" title="Rectángulo" onclick="seleccionarHerramienta('rectangulo', this)">
                    <i class="far fa-square"></i>
                </button>
                <button class="btn-tool" id="btnCirculo" title="Círculo" onclick="seleccionarHerramienta('circulo', this)">
                    <i class="far fa-circle"></i>
                </button>
            </div>

            <!-- Color -->
            <div class="tool-group">
                <span class="tool-label">Color</span>
                <div class="color-picker-wrap" title="Elige un color">
                    <input type="color" id="colorPicker" value="#7c4dff">
                </div>
                <!-- Paleta rápida -->
                <div class="paleta-colores" id="paleta">
                    <div class="color-rapido" style="background:#212121" data-color="#212121" title="Negro"></div>
                    <div class="color-rapido" style="background:#e53935" data-color="#e53935" title="Rojo"></div>
                    <div class="color-rapido" style="background:#f57c00" data-color="#f57c00" title="Naranja"></div>
                    <div class="color-rapido" style="background:#fdd835" data-color="#fdd835" title="Amarillo"></div>
                    <div class="color-rapido" style="background:#43a047" data-color="#43a047" title="Verde"></div>
                    <div class="color-rapido" style="background:#1e88e5" data-color="#1e88e5" title="Azul"></div>
                    <div class="color-rapido seleccionado" style="background:#7c4dff" data-color="#7c4dff" title="Morado"></div>
                    <div class="color-rapido" style="background:#ffffff;border:1.5px solid #ccc" data-color="#ffffff" title="Blanco"></div>
                </div>
            </div>

            <!-- Grosor -->
            <div class="tool-group">
                <span class="tool-label">Grosor</span>
                <div class="grosor-wrap">
                    <input type="range" id="grosorPincel" min="1" max="40" value="5">
                    <div class="grosor-preview">
                        <div class="grosor-punto" id="grosorPunto"></div>
                    </div>
                </div>
            </div>

            <!-- Acciones -->
            <div class="tool-group" style="margin-left:auto; border-right:none;">
                <button class="btn-accion btn-deshacer" onclick="deshacer()" title="Deshacer (Ctrl+Z)">
                    <i class="fas fa-undo"></i> Deshacer
                </button>
                <button class="btn-accion btn-limpiar" id="btnLimpiar">
                    <i class="fas fa-trash-alt"></i> Limpiar
                </button>
                <button class="btn-accion btn-guardar" id="btnGuardar">
                    <i class="fas fa-save"></i> Guardar nota
                </button>
            </div>

        </div><!-- /toolbar -->

        <!-- ── Canvas ── -->
        <div class="canvas-wrap">
            <canvas id="pizarra"></canvas>
            <div class="canvas-hint" id="canvasHint">
                <i class="fas fa-paint-brush"></i>
                <p>Empieza a dibujar aquí...</p>
            </div>
        </div>

        <!-- ── Barra inferior ── -->
        <div class="barra-inferior">
            <input type="text" class="input-titulo" id="inputTitulo"
                   placeholder="Título de tu nota de dibujo..." maxlength="100">
            <span class="estado-guardado" id="estadoGuardado">
                <i class="fas fa-check-circle"></i> Guardado
            </span>
            <button class="btn-accion btn-guardar" id="btnGuardar2" style="margin-left:auto;">
                <i class="fas fa-save"></i> Guardar nota
            </button>
        </div>

    </div><!-- /panel -->

    <!-- Toast -->
    <div class="toast-dibujo" id="toastDibujo"></div>


    <!-- ══════════════════════════════════════════
         JAVASCRIPT
    ══════════════════════════════════════════ -->
    <script>
    /* ──────────────────────────────────────────
       SETUP CANVAS
    ────────────────────────────────────────── */
    const canvas    = document.getElementById('pizarra');
    const ctx       = canvas.getContext('2d');
    const colorPicker  = document.getElementById('colorPicker');
    const grosorInput  = document.getElementById('grosorPincel');
    const grosorPunto  = document.getElementById('grosorPunto');
    const canvasHint   = document.getElementById('canvasHint');

    // Ajustar canvas al contenedor
    function ajustarCanvas() {
        const wrap = canvas.parentElement;
        const snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
        canvas.width  = wrap.clientWidth;
        canvas.height = 520;
        ctx.putImageData(snapshot, 0, 0);
        ctx.lineCap  = 'round';
        ctx.lineJoin = 'round';
    }
    ajustarCanvas();
    window.addEventListener('resize', ajustarCanvas);

    /* ──────────────────────────────────────────
       ESTADO
    ────────────────────────────────────────── */
    let dibujando    = false;
    let herramienta  = 'lapiz';
    let xIni = 0, yIni = 0;
    let snapshotForma = null;  // Para formas (línea, rect, círculo)
    let historial    = [];     // Pila de deshacer
    let lienzoPristino = true;

    /* ──────────────────────────────────────────
       UTILIDADES
    ────────────────────────────────────────── */
    function obtenerCoordenadas(e) {
        const rect = canvas.getBoundingClientRect();
        const src  = e.touches ? e.touches[0] : e;
        return {
            x: (src.clientX - rect.left) * (canvas.width  / rect.width),
            y: (src.clientY - rect.top)  * (canvas.height / rect.height)
        };
    }

    function colorActual() { return colorPicker.value; }
    function grosorActual() { return parseInt(grosorInput.value); }

    function guardarEstado() {
        if (historial.length >= 30) historial.shift();
        historial.push(canvas.toDataURL());
    }

    function aplicarConfiguracion() {
        ctx.lineCap   = 'round';
        ctx.lineJoin  = 'round';
        ctx.lineWidth = grosorActual();
        if (herramienta === 'borrador') {
            ctx.globalCompositeOperation = 'destination-out';
            ctx.strokeStyle = 'rgba(0,0,0,1)';
        } else {
            ctx.globalCompositeOperation = 'source-over';
            ctx.strokeStyle = colorActual();
        }
    }

    /* ──────────────────────────────────────────
       EVENTOS DE DIBUJO
    ────────────────────────────────────────── */
    function iniciar(e) {
        e.preventDefault();
        dibujando = true;
        const { x, y } = obtenerCoordenadas(e);
        xIni = x; yIni = y;

        // Guardar estado ANTES de empezar un trazo
        guardarEstado();

        // Para formas: guardar snapshot del lienzo antes de previsualizarla
        if (['linea','rectangulo','circulo'].includes(herramienta)) {
            snapshotForma = ctx.getImageData(0, 0, canvas.width, canvas.height);
        }

        // Punto inicial (lapiz / borrador)
        if (herramienta === 'lapiz' || herramienta === 'borrador') {
            aplicarConfiguracion();
            ctx.beginPath();
            ctx.moveTo(x, y);
        }

        // Marcar como no pristino
        if (lienzoPristino) {
            lienzoPristino = false;
            canvasHint.style.opacity = '0';
        }
    }

    function dibujar(e) {
        if (!dibujando) return;
        e.preventDefault();
        const { x, y } = obtenerCoordenadas(e);
        aplicarConfiguracion();

        if (herramienta === 'lapiz' || herramienta === 'borrador') {
            ctx.lineTo(x, y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x, y);

        } else if (herramienta === 'linea') {
            ctx.putImageData(snapshotForma, 0, 0);
            ctx.beginPath();
            ctx.moveTo(xIni, yIni);
            ctx.lineTo(x, y);
            ctx.stroke();

        } else if (herramienta === 'rectangulo') {
            ctx.putImageData(snapshotForma, 0, 0);
            ctx.beginPath();
            ctx.strokeRect(xIni, yIni, x - xIni, y - yIni);

        } else if (herramienta === 'circulo') {
            ctx.putImageData(snapshotForma, 0, 0);
            const rx = Math.abs(x - xIni) / 2;
            const ry = Math.abs(y - yIni) / 2;
            const cx = xIni + (x - xIni) / 2;
            const cy = yIni + (y - yIni) / 2;
            ctx.beginPath();
            ctx.ellipse(cx, cy, rx, ry, 0, 0, 2 * Math.PI);
            ctx.stroke();
        }
    }

    function detener(e) {
        if (!dibujando) return;
        dibujando = false;
        ctx.beginPath();
        snapshotForma = null;
    }

    /* Eventos mouse */
    canvas.addEventListener('mousedown',  iniciar);
    canvas.addEventListener('mousemove',  dibujar);
    canvas.addEventListener('mouseup',    detener);
    canvas.addEventListener('mouseleave', detener);

    /* Eventos táctiles */
    canvas.addEventListener('touchstart', iniciar,  { passive: false });
    canvas.addEventListener('touchmove',  dibujar,  { passive: false });
    canvas.addEventListener('touchend',   detener);

    /* ──────────────────────────────────────────
       DESHACER (Ctrl+Z)
    ────────────────────────────────────────── */
    function deshacer() {
        if (historial.length === 0) {
            mostrarToast('No hay más pasos para deshacer');
            return;
        }
        const img = new Image();
        img.src = historial.pop();
        img.onload = () => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0);
        };
        if (historial.length === 0) {
            lienzoPristino = true;
            canvasHint.style.opacity = '1';
        }
    }

    document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'z') {
            e.preventDefault();
            deshacer();
        }
    });

    /* ──────────────────────────────────────────
       SELECCIONAR HERRAMIENTA
    ────────────────────────────────────────── */
    function seleccionarHerramienta(nombre, btn) {
        herramienta = nombre;
        document.querySelectorAll('.btn-tool').forEach(b => b.classList.remove('activo'));
        btn.classList.add('activo');

        // Cambiar cursor
        canvas.style.cursor = nombre === 'borrador' ? 'cell' : 'crosshair';
    }

    /* ──────────────────────────────────────────
       PALETA RÁPIDA
    ────────────────────────────────────────── */
    document.getElementById('paleta').addEventListener('click', e => {
        const el = e.target.closest('.color-rapido');
        if (!el) return;
        colorPicker.value = el.dataset.color;
        document.querySelectorAll('.color-rapido').forEach(c => c.classList.remove('seleccionado'));
        el.classList.add('seleccionado');
        // Si estaba en borrador, volver a lápiz
        if (herramienta === 'borrador') {
            seleccionarHerramienta('lapiz', document.getElementById('btnLapiz'));
        }
    });

    colorPicker.addEventListener('input', () => {
        document.querySelectorAll('.color-rapido').forEach(c => c.classList.remove('seleccionado'));
    });

    /* ──────────────────────────────────────────
       PREVIEW GROSOR
    ────────────────────────────────────────── */
    grosorInput.addEventListener('input', () => {
        const v = parseInt(grosorInput.value);
        const size = Math.min(Math.max(v * 0.9, 3), 28);
        grosorPunto.style.width  = size + 'px';
        grosorPunto.style.height = size + 'px';
        grosorPunto.style.background = colorPicker.value;
    });
    colorPicker.addEventListener('input', () => {
        grosorPunto.style.background = colorPicker.value;
    });

    /* ──────────────────────────────────────────
       LIMPIAR
    ────────────────────────────────────────── */
    document.getElementById('btnLimpiar').addEventListener('click', () => {
        if (lienzoPristino) return;
        guardarEstado();
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        lienzoPristino = true;
        canvasHint.style.opacity = '1';
        mostrarToast('Lienzo limpiado');
    });

    /* ──────────────────────────────────────────
       GUARDAR NOTA — envía al backend
    ────────────────────────────────────────── */
    async function guardarNota() {
        const titulo = document.getElementById('inputTitulo').value.trim() || 'Dibujo sin título';

        if (lienzoPristino) {
            mostrarToast('¡El lienzo está vacío! Dibuja algo primero.');
            return;
        }

        // Convertir canvas a blob PNG
        canvas.toBlob(async (blob) => {
            const formData = new FormData();
            formData.append('titulo',  titulo);
            formData.append('formato', 'dibujo');
            formData.append('imagen',  blob, `${titulo.replace(/\s+/g,'_')}.png`);

            try {
                const resp = await fetch('/guardar-nota-dibujo', {
                    method: 'POST',
                    body: formData
                });
                const data = await resp.json();

                if (data.success) {
                    mostrarToast('✓ Nota guardada correctamente');
                    const est = document.getElementById('estadoGuardado');
                    est.classList.add('visible');
                    setTimeout(() => est.classList.remove('visible'), 3000);
                } else {
                    mostrarToast(data.error || 'Error al guardar');
                }
            } catch (err) {
                mostrarToast('Error de conexión');
            }
        }, 'image/png');
    }

    document.getElementById('btnGuardar').addEventListener('click',  guardarNota);
    document.getElementById('btnGuardar2').addEventListener('click', guardarNota);

    /* ──────────────────────────────────────────
       TOAST
    ────────────────────────────────────────── */
    let toastTimer = null;
    function mostrarToast(msg) {
        const t = document.getElementById('toastDibujo');
        t.textContent = msg;
        t.classList.add('visible');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('visible'), 3000);
    }
    </script>
</body>
</html>
