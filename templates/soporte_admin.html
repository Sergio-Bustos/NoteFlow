<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include 'partials/head_design.html' %}
    <title>Panel de Soporte | Admin NoteFlow</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/soporte_admin.css">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logocircular.png') }}">
</head>
<body>

<div class="admin-layout">
    <!-- Sidebar de Chats -->
    <div class="chats-sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-headset"></i> Soporte</h3>
            <div class="header-actions-top">
                <button id="theme-toggle-admin" class="btn-theme-admin" title="Cambiar tema">
                    <i class="fas fa-moon"></i>
                </button>
                <a href="/dashboard" class="btn-back-home"><i class="fas fa-home"></i></a>
            </div>
        </div>
        <div id="chats-list" class="chats-list">
            <!-- Cargando... -->
            <div class="loading-state">
                <i class="fas fa-spinner fa-spin"></i> Cargando conversaciones...
            </div>
        </div>
    </div>

    <!-- Área de Chat -->
    <div class="chat-main" id="chat-main">
        <div id="no-chat-selected" class="no-chat-selected">
            <i class="fas fa-comments"></i>
            <h3>Selecciona un chat para responder</h3>
            <p>Aquí aparecerán los mensajes de tus clientes en tiempo real.</p>
        </div>

        <div id="active-chat" class="active-chat-container" style="display: none;">
            <div class="chat-header">
                <div class="user-info">
                    <img id="active-user-photo" src="/static/default_profile.png" alt="" class="chat-avatar">
                    <div class="user-details-wrap">
                        <div class="name-plan">
                            <h4 id="active-user-name">Usuario</h4>
                            <span id="active-user-plan" class="plan-badge">Gratis</span>
                        </div>
                        <span id="active-user-status"><i class="fas fa-circle"></i> Chat activo</span>
                    </div>
                </div>
            </div>
            
            <div id="admin-chat-body" class="admin-chat-body">
                <!-- Mensajes aquí -->
            </div>

            <div class="chat-footer">
                <input type="text" id="admin-reply-input" placeholder="Escribe tu respuesta oficial..." autocomplete="off">
                <button id="admin-send-btn">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/soporte_admin.js"></script>
</body>
</html>
