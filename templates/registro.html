<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | NoteFlow</title>

    <link rel="stylesheet" href="/static/formulario.css">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logocircular.png') }}">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* ---- Ajuste de scroll para formulario largo de registro ---- */
        body {
            align-items: flex-start;
            overflow-y: auto;
            padding: 32px 16px 48px;
        }

        /* El formulario de registro es más largo, necesita más espacio */
        .formulario {
            margin: auto;
        }

        /* Scroll suave del carrusel cuando el body hace scroll */
        .fondo {
            position: fixed;
        }
        .overlay {
            position: fixed;
        }
    </style>
</head>
<body>

    <!-- ===== FONDO: CARRUSEL DE IMÁGENES ===== -->
    <div class="fondo">
        <div class="contenido">
            <div class="carrusel">
                <!-- Columna izquierda: baja -->
                <div class="columna_izquierda">
                    <img src="{{ url_for('static', filename='Logofondo.png') }}"  alt="">
                    <img src="{{ url_for('static', filename='Logofondo2.png') }}" alt="">
                    <img src="{{ url_for('static', filename='Logofondo.png') }}"  alt="">
                    <img src="{{ url_for('static', filename='Logofondo2.png') }}" alt="">
                </div>
                <!-- Columna derecha: sube -->
                <div class="columna_derecha">
                    <img src="{{ url_for('static', filename='Logofondo2.png') }}" alt="">
                    <img src="{{ url_for('static', filename='Logofondo.png') }}"  alt="">
                    <img src="{{ url_for('static', filename='Logofondo2.png') }}" alt="">
                    <img src="{{ url_for('static', filename='Logofondo.png') }}"  alt="">
                </div>
            </div>
        </div>
    </div>

    <!-- ===== OVERLAY ===== -->
    <div class="overlay"></div>

    <!-- ===== CONTENEDOR DE TOASTS ===== -->
    <div class="toast-container-custom"></div>

    <!-- ===== FORMULARIO ===== -->
    <form class="formulario" action="/procesar-registro" method="POST">

        <div class="formulario-logo">
            <span class="logo-text">Note<span class="logo-accent">Flow</span></span>
        </div>

        <nav>
            <ul class="formulario-ul">
                <li class="li-formulario">
                    <a href="/iniciarsesion.html">Iniciar Sesión</a>
                </li>
                <li class="li-formulario">
                    <a href="/registro.html" class="activo">Registro</a>
                </li>
            </ul>
        </nav>

        <h2 class="h2-registro">CREAR CUENTA</h2>

        <section class="inputs">

            <!-- Fila: nombre + apellido -->
            <div class="input-row">
                <div class="input-col">
                    <label>Nombre</label>
                    <input type="text"
                           name="nombre"
                           placeholder="Tu nombre"
                           autocomplete="given-name"
                           required>
                </div>
                <div class="input-col">
                    <label>Apellido</label>
                    <input type="text"
                           name="apellido"
                           placeholder="Tu apellido"
                           autocomplete="family-name"
                           required>
                </div>
            </div>

            <label>Teléfono</label>
            <input type="tel"
                   name="telefono"
                   placeholder="Ej: 3123456789"
                   autocomplete="tel"
                   required>

            <label>Correo electrónico</label>
            <input type="email"
                   name="correo"
                   placeholder="correo@ejemplo.com"
                   autocomplete="email"
                   required>

            <label>Apodo o alias</label>
            <input type="text"
                   name="usuario"
                   placeholder="Ej: Notero123"
                   autocomplete="username"
                   required>

            <label>Contraseña</label>
            <input type="password"
                   name="contraseña"
                   placeholder="Mínimo 6 caracteres"
                   autocomplete="new-password"
                   minlength="6"
                   maxlength="15"
                   required>
            <small class="campo-hint">Entre 6 y 15 caracteres</small>

        </section>

        <button type="submit">Crear cuenta</button>

        <p class="registro-link">
            ¿Ya tienes cuenta? <a href="/iniciarsesion.html">Iniciar sesión</a>
        </p>

    </form>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        /* ========== TOASTS ========== */
        function mostrarToast(mensaje, tipo = 'info') {
            const toastContainer = document.querySelector('.toast-container-custom');

            const config = {
                success: { icon: '✓', title: 'Éxito',  bgClass: 'toast-success' },
                error:   { icon: '✕', title: 'Error',   bgClass: 'toast-error'   },
                info:    { icon: 'ℹ', title: 'Info',    bgClass: 'toast-info'    }
            };

            const { icon, title, bgClass } = config[tipo] || config.info;

            const toastEl = document.createElement('div');
            toastEl.className = `toast ${bgClass}`;
            toastEl.setAttribute('role', 'alert');
            toastEl.setAttribute('aria-live', 'assertive');
            toastEl.setAttribute('aria-atomic', 'true');

            toastEl.innerHTML = `
                <div class="toast-header">
                    <strong class="me-auto">${icon} ${title}</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Cerrar"></button>
                </div>
                <div class="toast-body">${mensaje}</div>
            `;

            toastContainer.appendChild(toastEl);

            const toast = new bootstrap.Toast(toastEl, { autohide: true, delay: 4000 });
            toast.show();
            toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
        }

        /* ========== REGISTRO (FETCH) ========== */
        document.addEventListener('DOMContentLoaded', function () {
            const formRegistro = document.querySelector('form[action="/procesar-registro"]');

            if (formRegistro) {
                formRegistro.addEventListener('submit', async function (e) {
                    e.preventDefault();

                    const formData  = new FormData(this);
                    const submitBtn = this.querySelector('button[type="submit"]');
                    const btnText   = submitBtn.textContent;

                    submitBtn.disabled    = true;
                    submitBtn.textContent = 'Registrando...';

                    try {
                        const response = await fetch('/procesar-registro', {
                            method: 'POST',
                            body: formData
                        });

                        const data = await response.json();

                        if (data.success) {
                            mostrarToast('¡Cuenta creada exitosamente! Redirigiendo...', 'success');
                            setTimeout(() => {
                                window.location.href = data.redirect;
                            }, 1500);
                        } else {
                            mostrarToast(data.error || 'Error al registrar usuario', 'error');
                            submitBtn.disabled    = false;
                            submitBtn.textContent = btnText;
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        mostrarToast('Error de conexión. Por favor, intenta de nuevo.', 'error');
                        submitBtn.disabled    = false;
                        submitBtn.textContent = btnText;
                    }
                });
            }
        });
    </script>

</body>
</html>
