<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil | NoteFlow</title>

    <style>
        :root {
            --primary: #3498db;
            --bg: #f5f6fa;
            --text: #2c3e50;
            --card-bg: #ffffff;
            --radius: 12px;
            --border: #e1e4ea;
        }

        body {
            margin: 0;
            background: var(--bg);
            font-family: "Segoe UI", sans-serif;
            color: var(--text);
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: var(--radius);
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
            margin-bottom: 25px;
        }

        .title {
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .perfil-info {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .perfil-info img {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--primary);
        }

        .perfil-info .data p {
            margin: 5px 0;
            font-size: 1rem;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        input, select {
            width: 100%;
            padding: 10px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            margin-top: 5px;
        }

        button {
            padding: 10px 18px;
            background: var(--primary);
            border: none;
            border-radius: var(--radius);
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            opacity: 0.9;
        }

        .logout {
            background: #b71c1c;
        }
    </style>
</head>
<body>

                <input type="password" name="password_actual" required>
