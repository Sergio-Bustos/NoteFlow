<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel de Control | NoteFlow Admin</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='notas.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='soporte_admin.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='avatar.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="module" crossorigin src="/static/admin-react/dist/assets/index-HEfN79Xh.js"></script>
    <link rel="stylesheet" crossorigin href="/static/admin-react/dist/assets/index-tn0RQdqM.css">
  </head>
  <body>
    <div id="root"></div>

    <!-- ══ Variables globales Flask ══ -->
    <script>
      window.APP_USER = {
        nombres: "{{ usuario.Nombres if usuario.Nombres else 'Admin' }}",
        foto: "{{ usuario.Foto if usuario.Foto else 'default_profile.png' }}",
        es_premium: {{ 'true' if session.get('es_premium') else 'false' }},
        es_admin: {{ 'true' if session.get('es_admin') else 'false' }},
        plan_premium: "{{ session.get('plan_premium') if session.get('plan_premium') else 'gratis' }}",
        premium_color: "{{ session.get('premium_color') if session.get('premium_color') else '#f1c40f' }}",
        avatar_plan: "{{ session.get('avatar_plan') if session.get('avatar_plan') else '' }}"
      };
      window.COLOR_PRINCIPAL = "{{ usuario.Color_principal if usuario.Color_principal else 'Morado' }}";
      window.CSRF_TOKEN = "{{ csrf_token() }}";
    </script>

    <!-- ══ Modal premium (IDs y clases con prefijo nf- para no colisionar con Bootstrap) ══ -->
    <div id="nf-modal-backdrop" style="
        display:none;
        position:fixed;inset:0;
        background:rgba(0,0,0,.55);
        backdrop-filter:blur(6px);
        z-index:9999;
        align-items:center;
        justify-content:center;">
      <div style="
          background:var(--card-bg,#fff);
          border:2px solid rgba(84,82,211,.35);
          border-radius:14px;
          padding:28px 24px;
          box-shadow:0 8px 32px rgba(0,0,0,.25);
          min-width:340px;max-width:480px;width:90%;
          position:relative;
          color:var(--text-main,#2c3e50);">
        <!-- X cerrar -->
        <button class="nf-modal-close" aria-label="Cerrar" style="
            position:absolute;top:12px;right:14px;
            background:none;border:none;font-size:1.5rem;
            cursor:pointer;color:inherit;line-height:1;">&times;</button>
        <div id="nf-modal-title" style="font-size:1.15rem;font-weight:700;margin-bottom:14px;padding-right:24px;"></div>
        <div id="nf-modal-body"></div>
      </div>
    </div>

    <!-- ══ Scripts ══ -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/admin_modal.js') }}"></script>
  </body>
</html>
