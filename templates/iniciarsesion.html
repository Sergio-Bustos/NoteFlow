<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | NoteFlow</title>

    <link rel="stylesheet" href="/static/formulario.css">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logocircular.png') }}">

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <!-- ===== FONDO: CARRUSEL DE IMÁGENES ===== -->
    <div class="fondo">
        <div class="contenido">
            <div class="carrusel">
                <!-- Columna izquierda: baja -->
                <div class="columna_izquierda">
                    <img src="{{ url_for('static', filename='Logofondo.png') }}"  alt="">
                    <img src="{{ url_for('static', filename='Logofondo2.png') }}" alt="">
                    <img src="{{ url_for('static', filename='Logofondo.png') }}"  alt="">
                    <img src="{{ url_for('static', filename='Logofondo2.png') }}" alt="">
                </div>
                <!-- Columna derecha: sube -->
                <div class="columna_derecha">
                    <img src="{{ url_for('static', filename='Logofondo2.png') }}" alt="">
                    <img src="{{ url_for('static', filename='Logofondo.png') }}"  alt="">
                    <img src="{{ url_for('static', filename='Logofondo2.png') }}" alt="">
                    <img src="{{ url_for('static', filename='Logofondo.png') }}"  alt="">
                </div>
            </div>
        </div>
    </div>

    <!-- ===== OVERLAY PARA LEGIBILIDAD ===== -->
    <div class="overlay"></div>

    <!-- ===== CONTENEDOR DE TOASTS ===== -->
    <div class="toast-container-custom"></div>

    <!-- ===== FORMULARIO ===== -->
    <form class="formulario" action="/procesar-login" method="POST">

        <div class="formulario-logo">
            <span class="logo-text">Note<span class="logo-accent">Flow</span></span>
        </div>

        <nav>
            <ul class="formulario-ul">
                <li class="li-formulario">
                    <a href="/iniciarsesion.html" class="activo">Iniciar Sesión</a>
                </li>
                <li class="li-formulario">
                    <a href="/registro.html">Registro</a>
                </li>
            </ul>
        </nav>

        <h2 class="h2-registro">INICIAR SESIÓN</h2>

        <section class="inputs">
            <label>Apodo o alias</label>
            <input type="text"
                   name="usuario"
                   placeholder="Tu apodo o alias"
                   autocomplete="username"
                   required>

            <label>Contraseña</label>
            <input type="password"
                   name="contraseña"
                   placeholder="Tu contraseña"
                   autocomplete="current-password"
                   required>

            <p class="forgot-password">
                <a href="/olvide-contrasena">¿Olvidaste tu contraseña?</a>
            </p>
        </section>

        <button type="submit">Entrar</button>

        <div class="separador">
            <span>O inicia sesión con</span>
        </div>

        <button type="button" class="google-btn" onclick="window.location.href='/google/login'">
            <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/google/google-original.svg" alt="Google">
            <span>Iniciar sesión con Google</span>
        </button>

        <p class="registro-link">
            ¿No tienes cuenta? <a href="/registro.html">Regístrate gratis</a>
        </p>

    </form>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        /* ========== TOASTS ========== */
        function mostrarToast(mensaje, tipo = 'info') {
            const toastContainer = document.querySelector('.toast-container-custom');

            const config = {
                success: { icon: '✓', title: 'Éxito',        bgClass: 'toast-success' },
                error:   { icon: '✕', title: 'Error',         bgClass: 'toast-error'   },
                info:    { icon: 'ℹ', title: 'Información',  bgClass: 'toast-info'    }
            };

            const { icon, title, bgClass } = config[tipo] || config.info;

            const toastEl = document.createElement('div');
            toastEl.className = `toast ${bgClass}`;
            toastEl.setAttribute('role', 'alert');
            toastEl.setAttribute('aria-live', 'assertive');
            toastEl.setAttribute('aria-atomic', 'true');

            toastEl.innerHTML = `
                <div class="toast-header">
                    <strong class="me-auto">${icon} ${title}</strong>
                    <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Cerrar"></button>
                </div>
                <div class="toast-body">${mensaje}</div>
            `;

            toastContainer.appendChild(toastEl);

            const toast = new bootstrap.Toast(toastEl, { autohide: true, delay: 4000 });
            toast.show();

            toastEl.addEventListener('hidden.bs.toast', () => toastEl.remove());
        }

        /* ========== LOGIN (FETCH) ========== */
        document.addEventListener('DOMContentLoaded', function () {
            const formLogin = document.querySelector('form[action="/procesar-login"]');

            if (formLogin) {
                formLogin.addEventListener('submit', async function (e) {
                    e.preventDefault();

                    const formData  = new FormData(this);
                    const submitBtn = this.querySelector('button[type="submit"]');
                    const btnText   = submitBtn.textContent;

                    submitBtn.disabled    = true;
                    submitBtn.textContent = 'Iniciando sesión...';

                    try {
                        const response = await fetch('/procesar-login', {
                            method: 'POST',
                            body: formData
                        });

                        const data = await response.json();

                        if (data.success) {
                            mostrarToast('¡Bienvenido a NoteFlow!', 'success');
                            setTimeout(() => {
                                window.location.href = data.redirect;
                            }, 1000);
                        } else {
                            mostrarToast(data.error || 'Usuario o contraseña incorrectos', 'error');
                            submitBtn.disabled    = false;
                            submitBtn.textContent = btnText;
                        }
                    } catch (error) {
                        console.error('Error:', error);
                        mostrarToast('Error de conexión. Por favor, intenta de nuevo.', 'error');
                        submitBtn.disabled    = false;
                        submitBtn.textContent = btnText;
                    }
                });
            }
        });
    </script>

</body>
</html>
